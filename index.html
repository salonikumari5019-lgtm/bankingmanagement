<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saloni Finance Bank | Core Banking Management System</title>
<style>
:root{
  --navy:#0d203a; --navy2:#16345b; --blue:#2563eb; --sky:#3b82f6;
  --green:#10915c; --red:#dc4444; --orange:#ea8820; --purple:#7c4dbe;
  --bg:#f3f6fa; --text:#1f2937; --muted:#64748b; --line:#e1e6ed;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:14px}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* Header */
.top{background:#fff;border-bottom:1px solid #dce1e8;height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:52px;height:52px;background:var(--navy);color:#fff;font-weight:700;font-size:20px;display:grid;place-items:center}
.brand h2{margin:0;font-size:20px;color:var(--navy);letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.top-right{display:flex;gap:18px;align-items:center;font-size:12px;font-weight:700}
.online{color:var(--green)}
.admin{font-size:13px}

/* Shell */
.shell{flex:1;display:flex;min-height:0}
aside{width:225px;background:var(--navy);padding:18px 12px;display:flex;flex-direction:column;flex:none;overflow-y:auto}
aside .lbl{color:#96aac3;font-size:11px;font-weight:700;padding:0 10px 10px;letter-spacing:.8px}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:43px;padding:0 14px;margin-bottom:6px;background:var(--navy2);color:#fff;border:0;border-left:3px solid transparent;font-size:12.5px;font-weight:700;text-align:left;cursor:pointer}
.nav i{font-style:normal;width:16px;text-align:center}
.nav:hover{background:#1d4276}
.nav.active{background:#1f4a82;border-left-color:var(--sky)}
.nav.exit{background:var(--red);margin-top:8px}
.nav.exit:hover{background:#c43b3b}
.sec{margin-top:auto;color:#bed0e3;font-size:11px;padding:12px 8px}
.sec b{display:block;font-size:12px}
main{flex:1;overflow:auto;padding:24px}

/* Page */
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ph h1{margin:0;font-size:29px;font-weight:700}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13px}
.btn{background:var(--blue);color:#fff;border:0;padding:10px 18px;font-weight:700;font-size:12.5px;cursor:pointer}
.btn:hover{background:#1d4fd0}
.btn.ghost{background:#fff;color:var(--text);border:1px solid #cdd5df}
.btn.ghost:hover{background:#f1f5f9}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:22px}
.card{background:#fff;border:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.card small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px}
.card strong{display:block;font-size:21px;margin-top:4px;overflow-wrap:anywhere}
.card .ic{font-size:24px;font-weight:700;width:42px;text-align:center;flex:none}

.lower{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}
.panel{background:#fff;border:1px solid var(--line);padding:15px;min-width:0}
.panel h3{margin:0 0 12px;font-size:16px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 4px 4px}
.act{background:#f8fafc;border:1px solid #dce2ea;min-height:104px;font-weight:700;font-size:13.5px;cursor:pointer}
.act:hover{background:#eef3fa}

/* Tables */
.tw{overflow:auto;border:1px solid var(--line);background:#fff;max-height:calc(100vh - 260px)}
.panel .tw{max-height:none}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-size:12px;position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid #e6eaf0}
tbody tr:hover{background:#f1f6ff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--green);font-weight:700;font-size:12px}
.warn{color:var(--orange);font-weight:700;font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}

.search{width:100%;max-width:380px;height:38px;border:1px solid #cdd5df;padding:0 12px;margin:14px 0 12px;background:#fff}
.count{font-size:12px;color:var(--muted);margin-left:10px}

.report{background:#fff;border:1px solid var(--line);padding:22px;margin-top:18px;font-family:Consolas,"Courier New",monospace;font-size:13.5px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}

/* Dialog */
dialog{border:0;padding:0;width:min(520px,92vw);box-shadow:0 20px 60px rgba(13,32,58,.35)}
dialog::backdrop{background:rgba(13,32,58,.55)}
.dh{background:var(--navy);color:#fff;padding:14px 20px;font-weight:700;font-size:15px}
.db{padding:18px 20px;max-height:70vh;overflow:auto}
.df{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px 18px}
.row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-bottom:12px}
.row label{font-size:12px;font-weight:700}
.row input,.row select{width:100%;height:36px;border:1px solid #cdd5df;padding:0 10px;background:#fff}
.row .val{font-size:13px;overflow-wrap:anywhere}
.err{color:var(--red);font-size:12.5px;font-weight:600;margin:4px 0 0;min-height:18px}
.receipt{margin:0;font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.7;white-space:pre-wrap}

/* Exit screen */
.bye{margin:auto;text-align:center;padding:24px}
.bye .logo{margin:0 auto 18px}

@media (max-width:1100px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .lower{grid-template-columns:1fr}
}
@media (max-width:820px){
  .top{height:auto;padding:12px 14px;flex-wrap:wrap;gap:8px}
  .brand h2{font-size:17px}
  .shell{flex-direction:column}
  aside{width:100%;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:10px;gap:6px}
  aside .lbl,.sec{display:none}
  .nav{width:auto;white-space:nowrap;margin:0;flex:none}
  .nav.exit{margin:0}
  main{padding:16px}
  .ph h1{font-size:24px}
  .tw{max-height:none}
  .row{grid-template-columns:1fr;gap:4px}
}
@media (max-width:560px){
  .cards{grid-template-columns:1fr}
  .top-right{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo">SFB</div>
    <div>
      <h2>SALONI FINANCE BANK</h2>
      <p>Secure • Simple • Smart Banking</p>
    </div>
  </div>
  <div class="top-right">
    <span class="online">● SYSTEM ONLINE</span>
    <span class="admin">Administrator ▾</span>
  </div>
</header>

<div class="shell">
  <aside>
    <div class="lbl">MAIN MENU</div>
    <button class="nav" data-view="dashboard"><i>▣</i>Dashboard</button>
    <button class="nav" data-view="accounts"><i>▤</i>Accounts</button>
    <button class="nav" data-view="customers"><i>♙</i>Customers</button>
    <button class="nav" data-act="deposit"><i>＋</i>Deposit / Credit</button>
    <button class="nav" data-act="withdraw"><i>−</i>Withdraw / Debit</button>
    <button class="nav" data-act="transfer"><i>⇄</i>Money Transfer</button>
    <button class="nav" data-view="transactions"><i>◷</i>Transactions</button>
    <button class="nav" data-view="loans"><i>▣</i>Loans</button>
    <button class="nav" data-view="reports"><i>▥</i>Reports</button>
    <div class="sec"><b>Security</b>Demo environment<br>Data stored in memory</div>
    <button class="nav exit" data-act="exit"><i>⎋</i>Exit System</button>
  </aside>
  <main id="view"></main>
</div>

<dialog id="dlg"></dialog>

<script>
"use strict";

/* ============================================================
   SALONI FINANCE BANK - Web version of the Java Swing system
   All data is kept in memory (resets on page refresh).
   ============================================================ */

const customers = [], transactions = [], loans = [];
let current = "dashboard";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const view = $("#view");
const dlg = $("#dlg");
const money = n => n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const inr = n => "₹ " + money(n);
const round2 = n => Math.round(n * 100) / 100;
const p2 = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function stamp(){
  const d = new Date();
  return `${p2(d.getDate())}-${p2(d.getMonth()+1)}-${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const accNo = id => "SFB" + String(100000000 + id).padStart(9, "0");
const nextRef = () => "SFB-TXN-" + String(transactions.length + 1001).padStart(6, "0");

function addTxn(ref, type, from, to, amount, note){
  const t = {ref, type, from, to, amount, note, status: "SUCCESS", date: stamp()};
  transactions.push(t);
  return t;
}

/* ---------- default data (same as the Java version) ---------- */
(function seed(){
  const first = ["Aarav","Aditi","Aditya","Akash","Aman","Ananya","Ankit","Anjali","Arjun","Ayush",
    "Bhavna","Chandan","Deepak","Diya","Gaurav","Isha","Karan","Kavya","Krishna","Manish",
    "Meera","Mohit","Nandini","Neha","Nikhil","Pankaj","Pooja","Prakash","Priya","Rahul",
    "Raj","Riya","Rohit","Sakshi","Saloni","Sanjay","Shivam","Shreya","Siddharth","Simran",
    "Sonia","Sourav","Tanvi","Varun","Vikas","Vikram","Vishal","Yash","Zoya","Abhishek"];
  const last = ["Kumar","Singh","Sharma","Verma","Gupta","Yadav","Jha","Mishra","Sinha","Das",
    "Roy","Choudhary","Prasad","Thakur","Pandey","Tiwari","Mehta","Sah","Agarwal","Rana"];
  const cities = ["Patna","Begusarai","Araria","Purnia","Muzaffarpur","Bhagalpur","Darbhanga","Gaya","Ranchi","Kolkata"];
  const r = mulberry32(20260909);
  const pick = a => a[Math.floor(r() * a.length)];

  for (let i = 1; i <= 100; i++){
    const name = pick(first) + " " + pick(last);
    customers.push({
      id: i, name,
      accountNo: accNo(i),
      accountType: i % 5 === 0 ? "Current" : "Savings",
      phone: "9" + String(Math.floor(r() * 1e9)).padStart(9, "0"),
      email: name.toLowerCase().replace(" ", ".") + i + "@salonifinance.bank",
      city: pick(cities),
      balance: round2(10000 + Math.floor(r() * 24990000) + r()),
      status: "Active"
    });
  }

  const r2 = mulberry32(7788);
  for (let i = 1; i <= 35; i++){
    const c = customers[Math.floor(r2() * customers.length)];
    addTxn("SFB-TXN-" + String(i).padStart(6, "0"), "Opening / Credit",
           c.accountNo, "-", 1000 + Math.floor(r2() * 50000), "Initial system transaction");
  }
})();

/* ---------- dialog helper ---------- */
function modal({title, body, ok = "Confirm", cancel = "Cancel", onOk}){
  dlg.innerHTML = `
    <div class="dh">${esc(title)}</div>
    <div class="db">${body}<p class="err" id="err" role="alert"></p></div>
    <div class="df">
      ${cancel ? `<button class="btn ghost" id="mc" type="button">${esc(cancel)}</button>` : ""}
      <button class="btn" id="mo" type="button">${esc(ok)}</button>
    </div>`;
  const submit = () => { if (onOk && onOk() === false) return; dlg.close(); };
  const mc = $("#mc"); if (mc) mc.onclick = () => dlg.close();
  $("#mo").onclick = submit;
  dlg.onkeydown = e => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); submit(); } };
  if (!dlg.open) dlg.showModal();
  const f = dlg.querySelector("input,select"); if (f) f.focus();
}
const fail = msg => { $("#err").textContent = msg; return false; };
const field = (label, control) => `<div class="row"><label>${label}</label>${control}</div>`;
const accOptions = () => customers.map((c, i) =>
  `<option value="${i}">${esc(c.accountNo)} | ${esc(c.name)} | ₹${money(c.balance)}</option>`).join("");
const parseAmt = v => { const n = parseFloat(String(v).replace(/,/g, "")); return Number.isFinite(n) ? round2(n) : NaN; };

function receipt(heading, c, amount, type, note, ref){
  modal({
    title: "Transaction Receipt", ok: "Done", cancel: null,
    body: `<pre class="receipt">SALONI FINANCE BANK
----------------------------------------
${esc(heading)}
Reference : ${esc(ref)}
Account   : ${esc(c.accountNo)}
Customer  : ${esc(c.name)}
Type      : ${esc(type)}
Amount    : ${inr(amount)}
Narration : ${esc(note)}
Balance   : ${inr(c.balance)}
Status    : SUCCESS
----------------------------------------
Thank you for banking with SFB.</pre>`
  });
  render(current);
}

/* ---------- page parts ---------- */
const head = (title, sub, actions = "") =>
  `<div class="ph"><div><h1>${title}</h1><p>${sub}</p></div>${actions}</div>`;

const txnRowsShort = list => list.map(t => `
  <tr><td>${esc(t.ref)}</td><td>${esc(t.type)}</td><td>${esc(t.from)}</td>
  <td class="num">${inr(t.amount)}</td><td class="ok">${t.status}</td></tr>`).join("");

/* ---------- views ---------- */
const views = {

  dashboard(){
    const total = customers.reduce((s, c) => s + c.balance, 0);
    const recent = transactions.slice(-7).reverse();
    view.innerHTML = head("Dashboard", "Overview of Saloni Finance Bank core banking operations",
        `<button class="btn" data-act="open">＋ New Account</button>`) + `
      <div class="cards">
        <div class="card"><div><small>TOTAL DEPOSITS</small><strong>${inr(total)}</strong></div><span class="ic" style="color:var(--green)">₹</span></div>
        <div class="card"><div><small>CUSTOMERS</small><strong>${customers.length}</strong></div><span class="ic" style="color:var(--blue)">◉</span></div>
        <div class="card"><div><small>TRANSACTIONS</small><strong>${transactions.length}</strong></div><span class="ic" style="color:var(--purple)">↕</span></div>
        <div class="card"><div><small>LOAN APPLICATIONS</small><strong>${loans.length}</strong></div><span class="ic" style="color:var(--orange)">▣</span></div>
      </div>
      <div class="lower">
        <section class="panel">
          <h3>Recent Transactions</h3>
          <div class="tw"><table>
            <thead><tr><th>Reference</th><th>Type</th><th>Account</th><th class="num">Amount</th><th>Status</th></tr></thead>
            <tbody>${txnRowsShort(recent)}</tbody>
          </table></div>
        </section>
        <section class="panel">
          <h3>Quick Banking Actions</h3>
          <div class="actions">
            <button class="act" data-act="open" style="color:var(--blue)">＋&nbsp; Open Account</button>
            <button class="act" data-act="deposit" style="color:var(--green)">₹&nbsp; Deposit Money</button>
            <button class="act" data-act="withdraw" style="color:var(--red)">↕&nbsp; Withdraw Money</button>
            <button class="act" data-act="transfer" style="color:var(--purple)">⇄&nbsp; Transfer Funds</button>
          </div>
        </section>
      </div>`;
  },

  accounts(){
    view.innerHTML = head("Account Management", "Manage savings and current accounts",
        `<button class="btn" data-act="open">＋ Open New Account</button>`) + `
      <div><input class="search" id="q" type="search" placeholder="Search account, name, phone or city..." aria-label="Search accounts"><span class="count" id="cnt"></span></div>
      <div class="tw"><table>
        <thead><tr><th>Account No.</th><th>Customer</th><th>Type</th><th>Phone</th><th>City</th><th class="num">Balance</th><th>Status</th></tr></thead>
        <tbody id="tb"></tbody>
      </table></div>`;
    const fill = () => {
      const q = $("#q").value.trim().toLowerCase();
      const rows = customers.filter(c => !q ||
        (c.accountNo + " " + c.name + " " + c.phone + " " + c.city).toLowerCase().includes(q));
      $("#tb").innerHTML = rows.length ? rows.map(c => `
        <tr><td>${esc(c.accountNo)}</td><td>${esc(c.name)}</td><td>${c.accountType}</td>
        <td>${esc(c.phone)}</td><td>${esc(c.city)}</td><td class="num">${inr(c.balance)}</td>
        <td class="ok">${c.status}</td></tr>`).join("")
        : `<tr><td colspan="7" class="empty">No account matches your search.</td></tr>`;
      $("#cnt").textContent = rows.length + " of " + customers.length + " accounts";
    };
    $("#q").addEventListener("input", fill);
    fill();
  },

  customers(){
    view.innerHTML = head("Customer Management", "Customer profile and account information") + `
      <div class="tw" style="margin-top:18px"><table>
        <thead><tr><th>ID</th><th>Name</th><th>Account No.</th><th>Account Type</th><th>Phone</th><th>Email</th><th>City</th><th class="num">Balance</th></tr></thead>
        <tbody>${customers.map(c => `
          <tr><td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.accountNo)}</td><td>${c.accountType}</td>
          <td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${esc(c.city)}</td><td class="num">${inr(c.balance)}</td></tr>`).join("")}
        </tbody>
      </table></div>`;
  },

  transactions(){
    const rows = transactions.slice().reverse();
    view.innerHTML = head("Transaction History", "Complete banking transaction ledger") + `
      <div class="tw" style="margin-top:18px"><table>
        <thead><tr><th>Date</th><th>Reference</th><th>Type</th><th>From Account</th><th>To Account</th><th class="num">Amount</th><th>Status</th><th>Narration</th></tr></thead>
        <tbody>${rows.map(t => `
          <tr><td>${t.date}</td><td>${esc(t.ref)}</td><td>${esc(t.type)}</td><td>${esc(t.from)}</td><td>${esc(t.to)}</td>
          <td class="num">${inr(t.amount)}</td><td class="ok">${t.status}</td><td>${esc(t.note)}</td></tr>`).join("")}
        </tbody>
      </table></div>`;
  },

  loans(){
    view.innerHTML = head("Loan Management", "Loan applications submitted by customers",
        `<button class="btn" data-act="loan">＋ New Loan Application</button>`) + `
      <div class="tw" style="margin-top:18px"><table>
        <thead><tr><th>Application ID</th><th>Account No.</th><th>Loan Type</th><th class="num">Amount</th><th>Date</th><th>Status</th></tr></thead>
        <tbody>${loans.length ? loans.slice().reverse().map(l => `
          <tr><td>${l.id}</td><td>${esc(l.accountNo)}</td><td>${esc(l.type)}</td>
          <td class="num">${inr(l.amount)}</td><td>${l.date}</td><td class="warn">${l.status}</td></tr>`).join("")
          : `<tr><td colspan="6" class="empty">No loan applications yet. Use “New Loan Application” to add one.</td></tr>`}
        </tbody>
      </table></div>`;
  },

  reports(){
    let total = 0, savings = 0, current_ = 0, active = 0;
    customers.forEach(c => {
      total += c.balance;
      if (c.accountType === "Savings") savings += c.balance; else current_ += c.balance;
      if (c.status === "Active") active++;
    });
    view.innerHTML = head("Bank Report", "Management summary of Saloni Finance Bank") + `
      <div class="report">SALONI FINANCE BANK - MANAGEMENT REPORT

Total Customers      : ${customers.length}
Active Accounts      : ${active}
Savings Deposits     : ${inr(savings)}
Current Deposits     : ${inr(current_)}
Total Deposits       : ${inr(total)}
Transactions         : ${transactions.length}
Loan Applications    : ${loans.length}
System Status        : ONLINE

Note: This is an educational banking simulation.</div>`;
  }
};

function render(name){
  current = name;
  document.querySelectorAll(".nav[data-view]").forEach(b =>
    b.classList.toggle("active", b.dataset.view === name));
  views[name]();
  view.scrollTop = 0;
}

/* ---------- banking actions ---------- */
const actions = {

  open(){
    modal({
      title: "Open New Bank Account", ok: "Open account",
      body:
        field("Customer Name *", `<input id="f-name" autocomplete="off">`) +
        field("Mobile Number *", `<input id="f-phone" inputmode="numeric" maxlength="10" autocomplete="off">`) +
        field("Email", `<input id="f-email" type="email" autocomplete="off">`) +
        field("City", `<input id="f-city" autocomplete="off">`) +
        field("Account Type", `<select id="f-type"><option>Savings</option><option>Current</option></select>`) +
        field("Opening Balance (₹) *", `<input id="f-bal" inputmode="decimal" value="10000">`),
      onOk(){
        const name = $("#f-name").value.trim();
        const phone = $("#f-phone").value.trim();
        const amount = parseAmt($("#f-bal").value);
        if (!name) return fail("Enter the customer name.");
        if (!/^\d{10}$/.test(phone)) return fail("Enter a valid 10-digit mobile number.");
        if (!(amount >= 10000)) return fail("Minimum opening balance is ₹10,000.");
        const id = customers.length + 1;
        const c = {
          id, name, accountNo: accNo(id), accountType: $("#f-type").value, phone,
          email: $("#f-email").value.trim(), city: $("#f-city").value.trim(),
          balance: amount, status: "Active"
        };
        customers.push(c);
        addTxn(nextRef(), "Account Opening", c.accountNo, "-", amount, "New account opened");
        setTimeout(() => {
          modal({
            title: "Account Created", ok: "Done", cancel: null,
            body: `<pre class="receipt">Account opened successfully!

Bank            : Saloni Finance Bank
Account No      : ${esc(c.accountNo)}
Customer        : ${esc(c.name)}
Opening Balance : ${inr(amount)}</pre>`
          });
        }, 0);
        render("accounts");
      }
    });
  },

  deposit(){
    modal({
      title: "Deposit / Credit", ok: "Credit money",
      body:
        field("Account", `<select id="f-acc">${accOptions()}</select>`) +
        field("Amount (₹)", `<input id="f-amt" inputmode="decimal" autocomplete="off">`) +
        field("Narration", `<input id="f-note" value="Cash deposit" autocomplete="off">`),
      onOk(){
        const c = customers[$("#f-acc").value];
        const a = parseAmt($("#f-amt").value);
        if (!(a > 0)) return fail("Enter a valid positive amount.");
        const note = $("#f-note").value.trim() || "Cash deposit";
        c.balance = round2(c.balance + a);
        const t = addTxn(nextRef(), "Credit", c.accountNo, "-", a, note);
        setTimeout(() => receipt("CREDIT SUCCESSFUL", c, a, "Credit", note, t.ref), 0);
      }
    });
  },

  withdraw(){
    modal({
      title: "Withdraw / Debit", ok: "Debit money",
      body:
        field("Account", `<select id="f-acc">${accOptions()}</select>`) +
        field("Amount (₹)", `<input id="f-amt" inputmode="decimal" autocomplete="off">`) +
        field("Narration", `<input id="f-note" value="Cash withdrawal" autocomplete="off">`),
      onOk(){
        const c = customers[$("#f-acc").value];
        const a = parseAmt($("#f-amt").value);
        if (!(a > 0)) return fail("Enter a valid positive amount.");
        if (a > c.balance) return fail("Insufficient balance. Available: " + inr(c.balance));
        const note = $("#f-note").value.trim() || "Cash withdrawal";
        c.balance = round2(c.balance - a);
        const t = addTxn(nextRef(), "Debit", c.accountNo, "-", a, note);
        setTimeout(() => receipt("DEBIT SUCCESSFUL", c, a, "Debit", note, t.ref), 0);
      }
    });
  },

  transfer(){
    modal({
      title: "Money Transfer", ok: "Transfer",
      body:
        field("From (Sender)", `<select id="f-from">${accOptions()}</select>`) +
        field("To (Receiver)", `<select id="f-to">${accOptions()}</select>`) +
        field("Amount (₹)", `<input id="f-amt" inputmode="decimal" autocomplete="off">`) +
        field("Narration", `<input id="f-note" value="Fund transfer" autocomplete="off">`),
      onOk(){
        const from = customers[$("#f-from").value];
        const to = customers[$("#f-to").value];
        const a = parseAmt($("#f-amt").value);
        if (from === to) return fail("Sender and receiver cannot be the same account.");
        if (!(a > 0)) return fail("Enter a valid positive amount.");
        if (a > from.balance) return fail("Transfer declined: insufficient balance.");
        const note = $("#f-note").value.trim() || "Fund transfer";
        from.balance = round2(from.balance - a);
        to.balance = round2(to.balance + a);
        const t = addTxn(nextRef(), "Transfer", from.accountNo, to.accountNo, a, note);
        setTimeout(() => modal({
          title: "Transaction Successful", ok: "Done", cancel: null,
          body: `<pre class="receipt">TRANSFER SUCCESSFUL

Reference   : ${esc(t.ref)}
From        : ${esc(from.accountNo)}
To          : ${esc(to.accountNo)}
Amount      : ${inr(a)}
New Balance : ${inr(from.balance)}</pre>`
        }), 0);
        render(current);
      }
    });
  },

  loan(){
    modal({
      title: "Loan Application", ok: "Submit application",
      body:
        field("Applicant", `<select id="f-acc">${accOptions()}</select>`) +
        field("Loan Type", `<select id="f-type"><option>Home Loan</option><option>Education Loan</option><option>Vehicle Loan</option><option>Personal Loan</option><option>Business Loan</option></select>`) +
        field("Loan Amount (₹)", `<input id="f-amt" inputmode="decimal" autocomplete="off">`),
      onOk(){
        const c = customers[$("#f-acc").value];
        const a = parseAmt($("#f-amt").value);
        if (!(a > 0)) return fail("Enter a valid loan amount.");
        const type = $("#f-type").value;
        const id = "SFB-LOAN-" + String(loans.length + 1).padStart(5, "0");
        loans.push({id, accountNo: c.accountNo, type, amount: a, status: "Under Review", date: stamp().slice(0, 10)});
        setTimeout(() => modal({
          title: "Loan Application", ok: "Done", cancel: null,
          body: `<pre class="receipt">Loan application submitted.

Application ID : ${id}
Applicant      : ${esc(c.name)}
Type           : ${esc(type)}
Amount         : ${inr(a)}
Status         : Under Review</pre>`
        }), 0);
        render(current === "loans" ? "loans" : current);
      }
    });
  },

  exit(){
    modal({
      title: "Confirm Exit", ok: "Exit", cancel: "Stay",
      body: `<p style="margin:0">Close Saloni Finance Bank system?</p>`,
      onOk(){
        document.body.innerHTML = `
          <div class="bye">
            <div class="logo">SFB</div>
            <h1 style="margin:0 0 6px">You have exited the system</h1>
            <p style="color:#64748b;margin:0 0 20px">All demo data in memory has been cleared.</p>
            <button class="btn" onclick="location.reload()">Start again</button>
          </div>`;
      }
    });
  }
};

/* ---------- wiring ---------- */
document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]");
  if (v) return render(v.dataset.view);
  const a = e.target.closest("[data-act]");
  if (a && actions[a.dataset.act]) actions[a.dataset.act]();
});

render("dashboard");
</script>
</body>
</html>
